name: Build Android APK
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n1)
          mkdir _x && unzip -q "$ZIP" -d _x
          SRC=$(dirname "$(find _x -name package.json -not -path '*/node_modules/*' | head -n1)")
          cp -r "$SRC"/. .
          rm -rf _x

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm test
      - run: npm install
      - run: npx cap add android

      - name: Allow microphone
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' "$M"

      - name: App icon
        continue-on-error: true
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#120b24' --iconBackgroundColorDark '#120b24'

      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Karaoke.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Karaoke-apk
          path: Karaoke.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: Karaoke.apk
